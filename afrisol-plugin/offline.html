<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Afrisol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            color: #fff;
            max-width: 500px;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .offline-icon svg {
            width: 60px;
            height: 60px;
            fill: #FF9800;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: #FF9800;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .retry-btn:hover {
            background: #F57C00;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .tips {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: left;
        }
        
        .tips h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .tips ul {
            list-style: none;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .tips ul li {
            padding: 0.25rem 0;
        }
        
        .tips ul li::before {
            content: "•";
            color: #FF9800;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 8.98C22.93 7.91 21.76 6.97 20.47 6.16L23.64 3L22.23 1.58L1.41 22.4L2.83 23.82L6.72 19.93C8.37 20.6 10.15 21 12 21C17.55 21 22.22 17.81 24 13.32V14.73C24 14.73 24 8.98 24 8.98ZM2.05 6.29L3.47 4.87C5.8 6.47 8.77 7.53 12 7.53C12.34 7.53 12.68 7.52 13 7.5L8.23 12.27C5.63 11.37 3.5 9.24 2.05 6.29ZM12 3C9.3 3 6.82 3.91 4.8 5.48L6.24 6.92C7.97 5.72 9.91 5 12 5C18.08 5 23.39 9.26 24 14.73V8.98C22.22 4.19 17.55 1 12 1C9.15 1 6.5 1.93 4.31 3.54L5.77 5C7.5 3.76 9.66 3 12 3Z"/>
            </svg>
        </div>
        
        <h1>You're Offline</h1>
        <p>It seems like you've lost your internet connection. Don't worry - once you're back online, you'll be able to browse our solar solutions.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12S8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z"/>
            </svg>
            Try Again
        </button>
        
        <div class="tips">
            <h3>While you wait:</h3>
            <ul>
                <li>Check your Wi-Fi connection</li>
                <li>Try moving to an area with better signal</li>
                <li>Contact us at: +234 XXX XXX XXXX</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Auto-reload when back online
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
