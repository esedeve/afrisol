<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#FFB74D"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>
  
  <!-- Sun Icon -->
  <circle cx="25" cy="30" r="12" fill="url(#sunGradient)"/>
  
  <!-- Sun Rays -->
  <g stroke="#FF9800" stroke-width="2" stroke-linecap="round">
    <line x1="25" y1="10" x2="25" y2="5"/>
    <line x1="25" y1="55" x2="25" y2="50"/>
    <line x1="5" y1="30" x2="10" y2="30"/>
    <line x1="40" y1="30" x2="45" y2="30"/>
    <line x1="11" y1="16" x2="14" y2="19"/>
    <line x1="36" y1="41" x2="39" y2="44"/>
    <line x1="39" y1="16" x2="36" y2="19"/>
    <line x1="14" y1="41" x2="11" y2="44"/>
  </g>
  
  <!-- Text: AFRISOL -->
  <text x="55" y="40" font-family="Montserrat, sans-serif" font-size="28" font-weight="800" fill="url(#textGradient)">AFRISOL</text>
</svg>
